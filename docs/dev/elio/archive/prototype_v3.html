<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Эльо — макет полей v3 (квадратная сетка 3-4-3-4-3)</title>
<style>
  :root { --bg:#1a1a2e; --panel:#23234a; --gold:#c9a227; --plus:#5b9bd5; --minus:#e05a5a; --zero:#9aa0a6; --text:#e8e8f0; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font-family:'Segoe UI',Georgia,serif; }
  h1 { margin:0 0 6px; color:var(--gold); letter-spacing:1px; }
  .subtitle { opacity:.7; font-size:13px; margin-bottom:12px; }
  .layout { display:flex; gap:16px; flex-wrap:wrap; }
  .board-wrap { flex:1 1 700px; min-width:700px; }
  svg { background:radial-gradient(circle at 50% 40%, #2a2a4e 0%, #12122a 100%); border:2px solid var(--gold); border-radius:12px; display:block; width:100%; height:auto; }
  .side { flex:0 0 260px; }
  .card { background:var(--panel); border:1px solid #3a3a6a; border-radius:10px; padding:12px; margin-bottom:12px; }
  .card h3 { margin:0 0 8px; color:var(--gold); font-size:15px; }
  .legend { display:flex; flex-direction:column; gap:6px; font-size:13px; }
  .legend-item { display:flex; align-items:center; gap:8px; }
  .dot { width:14px; height:14px; border-radius:50%; border:2px solid #fff; }
  .btn { background:var(--gold); color:#1a1a2e; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; font-weight:bold; margin-right:6px; margin-bottom:6px; }
  .btn:hover { filter:brightness(1.15); }
  .info { font-size:13px; line-height:1.5; min-height:60px; }
  .info b { color:var(--gold); }
  .cell { cursor:pointer; }
  .cell:hover { filter:brightness(1.35); }
  .cellsel { stroke:var(--gold) !important; stroke-width:3 !important; }
  .piece.blocked { opacity:.25; }
  footer { margin-top:12px; font-size:11px; opacity:.5; }
</style>
</head>
<body>
  <h1>Эльо — макет полей v3</h1>
  <div class="subtitle">Квадратная сетка 3-4-3-4-3 (17 клеток) внутри гексагонального поля. По наброску пользователя.</div>

  <div class="layout">
    <div class="board-wrap">
      <svg id="board" viewBox="0 0 900 720"></svg>
    </div>
    <div class="side">
      <div class="card">
        <h3>Легенда</h3>
        <div class="legend">
          <div class="legend-item"><span class="dot" style="background:var(--plus)"></span> Плюсы</div>
          <div class="legend-item"><span class="dot" style="background:var(--minus)"></span> Минусы</div>
          <div class="legend-item"><span class="dot" style="background:var(--zero)"></span> Нули</div>
          <div class="legend-item"><span style="color:var(--gold);font-weight:bold">К</span> — Капитан (1-й ранг)</div>
          <div class="legend-item"><span style="color:var(--gold);font-weight:bold">Ф</span> — Фрегат (2-й ранг)</div>
          <div class="legend-item"><span style="color:var(--gold);font-weight:bold">Н</span> — Нуль (0 ранг)</div>
        </div>
      </div>
      <div class="card">
        <h3>Погода</h3>
        <button class="btn" onclick="toggleWeather()">Переключить</button>
        <button class="btn" onclick="clearSel()">Сброс</button>
        <div id="weather" style="margin-top:8px;font-size:13px;">Погода выключена</div>
      </div>
      <div class="card">
        <h3>Клетка</h3>
        <div id="info" class="info">Кликните по клетке.</div>
      </div>
    </div>
  </div>
  <footer>docs/dev/elio/ · макет v3</footer>

<script>
const NS = 'http://www.w3.org/2000/svg';
const board = document.getElementById('board');

const CENTER = { x: 450, y: 390 };
const R_ORBIT = 220;
const HEX_SIZE = 120;
const CELL_W = 44;
const CELL_H = 40;
const ROWS = [3, 4, 3, 4, 3]; // 17 клеток

const FIELDS = [
  { id:'A', name:'Плюсы',  faction:'plus',  color:'#5b9bd5', cx:CENTER.x,               cy:CENTER.y - R_ORBIT },
  { id:'B', name:'Минусы', faction:'minus', color:'#e05a5a', cx:CENTER.x - R_ORBIT*Math.sqrt(3)/2, cy:CENTER.y + R_ORBIT/2 },
  { id:'C', name:'Нули',   faction:'zero',  color:'#9aa0a6', cx:CENTER.x + R_ORBIT*Math.sqrt(3)/2, cy:CENTER.y + R_ORBIT/2 },
];

function hexPoints(cx, cy, s) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = Math.PI/180 * (60*i - 30);
    pts.push((cx + s*Math.cos(a)).toFixed(1) + ',' + (cy + s*Math.sin(a)).toFixed(1));
  }
  return pts.join(' ');
}

const cells = [];

FIELDS.forEach(f => {
  const g = document.createElementNS(NS, 'g');

  // контур гекса
  const outline = document.createElementNS(NS, 'polygon');
  outline.setAttribute('points', hexPoints(f.cx, f.cy, HEX_SIZE));
  outline.setAttribute('fill', f.color + '14');
  outline.setAttribute('stroke', f.color);
  outline.setAttribute('stroke-width', '2.5');
  g.appendChild(outline);

  // квадратная сетка 3-4-3-4-3
  let rowIndex = 0;
  ROWS.forEach((count, r) => {
    const rowWidth = count * CELL_W;
    const startX = f.cx - rowWidth / 2;
    const y = f.cy - 2*CELL_H + r*CELL_H;
    for (let i = 0; i < count; i++) {
      const x = startX + i*CELL_W;
      const rect = document.createElementNS(NS, 'rect');
      rect.setAttribute('x', x + 1);
      rect.setAttribute('y', y + 1);
      rect.setAttribute('width', CELL_W - 2);
      rect.setAttribute('height', CELL_H - 2);
      rect.setAttribute('fill', f.color + '18');
      rect.setAttribute('stroke', '#6a6a9a');
      rect.setAttribute('stroke-width', '1');
      rect.setAttribute('class', 'cell');
      rect.dataset.field = f.id;
      rect.dataset.row = r;
      rect.dataset.col = i;
      rect.dataset.idx = rowIndex++;
      rect.addEventListener('click', () => selectCell(f, r, i, x + CELL_W/2, y + CELL_H/2));
      g.appendChild(rect);
      cells.push({ field: f.id, row: r, col: i, idx: rowIndex-1, x: x + CELL_W/2, y: y + CELL_H/2, el: rect, piece: null });
    }
  });

  // подпись поля
  const label = document.createElementNS(NS, 'text');
  label.setAttribute('x', f.cx);
  label.setAttribute('y', f.cy - HEX_SIZE - 12);
  label.setAttribute('text-anchor', 'middle');
  label.setAttribute('fill', f.color);
  label.setAttribute('font-size', '15');
  label.setAttribute('font-weight', 'bold');
  label.textContent = f.name;
  g.appendChild(label);

  board.appendChild(g);
});

// --- основание ---
const baseR = 70;
const basePts = [
  [CENTER.x, CENTER.y - baseR],
  [CENTER.x - baseR*Math.sqrt(3)/2, CENTER.y + baseR/2],
  [CENTER.x + baseR*Math.sqrt(3)/2, CENTER.y + baseR/2],
];
const baseTri = document.createElementNS(NS, 'polygon');
baseTri.setAttribute('points', basePts.map(p => p.join(',')).join(' '));
baseTri.setAttribute('fill', '#c9a22718');
baseTri.setAttribute('stroke', '#c9a227');
baseTri.setAttribute('stroke-width', '2');
board.appendChild(baseTri);

const baseCells = [
  { x: CENTER.x, y: CENTER.y, type: 'center' },
  { x: CENTER.x, y: CENTER.y - 34, type: 'support' },
  { x: CENTER.x - 30, y: CENTER.y + 20, type: 'support' },
  { x: CENTER.x + 30, y: CENTER.y + 20, type: 'support' },
];
baseCells.forEach(c => {
  const circle = document.createElementNS(NS, 'circle');
  circle.setAttribute('cx', c.x); circle.setAttribute('cy', c.y);
  circle.setAttribute('r', c.type === 'center' ? 16 : 11);
  circle.setAttribute('fill', c.type === 'center' ? '#c9a22733' : '#4a4a7a66');
  circle.setAttribute('stroke', '#c9a227');
  circle.setAttribute('stroke-width', c.type === 'center' ? '2' : '1');
  circle.setAttribute('class', 'cell');
  circle.addEventListener('click', () => selectBase(c));
  board.appendChild(circle);
  if (c.type === 'center') {
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', c.x); t.setAttribute('y', c.y + 5);
    t.setAttribute('text-anchor', 'middle'); t.setAttribute('fill', '#c9a227');
    t.setAttribute('font-size', '13'); t.setAttribute('font-weight', 'bold');
    t.textContent = 'Ц';
    board.appendChild(t);
  }
});

const baseLabel = document.createElementNS(NS, 'text');
baseLabel.setAttribute('x', CENTER.x); baseLabel.setAttribute('y', CENTER.y + baseR + 18);
baseLabel.setAttribute('text-anchor', 'middle'); baseLabel.setAttribute('fill', '#c9a227');
baseLabel.setAttribute('font-size', '12'); baseLabel.textContent = 'ОСНОВАНИЕ';
board.appendChild(baseLabel);

// --- спорные земли ---
const disputedCenters = [
  { id:'AB', x: (FIELDS[0].cx + FIELDS[1].cx)/2, y: (FIELDS[0].cy + FIELDS[1].cy)/2 },
  { id:'AC', x: (FIELDS[0].cx + FIELDS[2].cx)/2, y: (FIELDS[0].cy + FIELDS[2].cy)/2 },
  { id:'BC', x: (FIELDS[1].cx + FIELDS[2].cx)/2, y: (FIELDS[1].cy + FIELDS[2].cy)/2 },
];
const disputedOffsets = [ [0,-16], [-14,10], [14,10] ];
disputedCenters.forEach(d => {
  const tri = document.createElementNS(NS, 'polygon');
  tri.setAttribute('points', `${d.x},${d.y-26} ${d.x-24},${d.y+18} ${d.x+24},${d.y+18}`);
  tri.setAttribute('fill', '#8a8ab010');
  tri.setAttribute('stroke', '#8a8ab0');
  tri.setAttribute('stroke-width', '1.2');
  tri.setAttribute('stroke-dasharray', '4 3');
  board.appendChild(tri);
  disputedOffsets.forEach((o, i) => {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', d.x + o[0]); c.setAttribute('cy', d.y + o[1]);
    c.setAttribute('r', 9);
    c.setAttribute('fill', '#4a4a7a66'); c.setAttribute('stroke', '#8a8ab0');
    c.setAttribute('class', 'cell');
    c.addEventListener('click', () => selectDisputed(d.id, i));
    board.appendChild(c);
  });
});

// --- фигуры ---
function place(fieldId, faction, types) {
  const list = cells.filter(c => c.field === fieldId);
  // дальние клетки: верхние ряды (row 0,1)
  const far = list.filter(c => c.row <= 1);
  types.forEach((t, i) => {
    const cell = far[i];
    if (!cell) return;
    const color = faction === 'plus' ? '#5b9bd5' : faction === 'minus' ? '#e05a5a' : '#9aa0a6';
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'piece');
    const circle = document.createElementNS(NS, 'circle');
    circle.setAttribute('cx', cell.x); circle.setAttribute('cy', cell.y);
    circle.setAttribute('r', t === 'K' ? 11 : t === 'F' ? 9 : 7);
    circle.setAttribute('fill', color);
    circle.setAttribute('stroke', '#fff');
    circle.setAttribute('stroke-width', '1.5');
    g.appendChild(circle);
    const txt = document.createElementNS(NS, 'text');
    txt.setAttribute('x', cell.x); txt.setAttribute('y', cell.y + 4);
    txt.setAttribute('text-anchor', 'middle'); txt.setAttribute('fill', '#fff');
    txt.setAttribute('font-size', t === 'K' ? 11 : t === 'F' ? 9 : 8);
    txt.setAttribute('font-weight', 'bold');
    txt.textContent = t;
    g.appendChild(txt);
    board.appendChild(g);
    cell.piece = { faction, type: t };
  });
}
place('A', 'plus',  ['K','K','F','F','F']);
place('B', 'minus', ['K','K','F','F','F']);
place('C', 'zero',  ['N','N','N','N','N']);

// --- интерактив ---
let selectedEl = null;
function clearSel() {
  if (selectedEl) selectedEl.classList.remove('cellsel');
  selectedEl = null;
  document.getElementById('info').textContent = 'Кликните по клетке.';
}
function selectCell(field, row, col, x, y) {
  const cell = cells.find(c => c.field === field.id && c.row === row && c.col === col);
  if (!cell) return;
  if (selectedEl) selectedEl.classList.remove('cellsel');
  selectedEl = cell.el; cell.el.classList.add('cellsel');
  const p = cell.piece ? `${cell.piece.faction} / ${cell.piece.type}` : 'пусто';
  document.getElementById('info').innerHTML =
    `<b>Поле:</b> ${field.name} (${field.id})<br><b>Клетка:</b> ряд ${row+1}, кол ${col+1}<br><b>Фигура:</b> ${p}`;
}
function selectBase(c) {
  if (selectedEl) selectedEl.classList.remove('cellsel');
  selectedEl = null;
  document.getElementById('info').innerHTML =
    `<b>Основание:</b> ${c.type === 'center' ? 'центральная клетка' : 'клетка поддержки'}<br>Центр нужно удержать 3 хода.`;
}
function selectDisputed(id, i) {
  if (selectedEl) selectedEl.classList.remove('cellsel');
  selectedEl = null;
  document.getElementById('info').innerHTML =
    `<b>Спорная земля:</b> ${id}, клетка ${i + 1} из 3<br>Нейтральная зона; нули принимают сторону соседа.`;
}

let weatherOn = false;
function toggleWeather() {
  weatherOn = !weatherOn;
  const names = { plus:'Плюсы', minus:'Минусы', zero:'Нули' };
  if (!weatherOn) {
    document.querySelectorAll('.piece').forEach(p => p.classList.remove('blocked'));
    document.getElementById('weather').textContent = 'Погода выключена';
    return;
  }
  const fac = ['plus','minus','zero'][Math.floor(Math.random()*3)];
  const byColor = { '#5b9bd5':'plus', '#e05a5a':'minus', '#9aa0a6':'zero' };
  document.querySelectorAll('.piece').forEach(p => {
    const fill = p.querySelector('circle').getAttribute('fill');
    if (byColor[fill] === fac) p.classList.add('blocked');
  });
  document.getElementById('weather').textContent = `Погода ВКЛ. В шторме: ${names[fac]}`;
}
</script>
</body>
</html>
